<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101510">
  <title>NEON SNAKE</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101510;
      --panel: #182019;
      --panel2: #202a21;
      --green: #a6ff65;
      --green2: #6bcf45;
      --muted: #91a18f;
      --line: #344235;
      --red: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f1f6ed;
      background: radial-gradient(ellipse at 50% 0%, #263b25 0%, var(--bg) 58%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .shell { width: min(94vw, 620px); }
    header { display:flex; justify-content:space-between; align-items:end; margin: 0 2px 16px; gap:16px; }
    .eyebrow { color:var(--green); font-size:11px; letter-spacing:.24em; font-weight:800; }
    h1 { margin:4px 0 0; font-size:clamp(28px, 6vw, 42px); letter-spacing:-.06em; line-height:1; }
    .version { color:var(--muted); font-size:11px; letter-spacing:.12em; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
    .stat { background:linear-gradient(145deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:12px 16px; }
    .stat span { display:block; color:var(--muted); font-size:10px; letter-spacing:.16em; font-weight:800; }
    .stat strong { display:block; margin-top:3px; font-size:26px; line-height:1; font-variant-numeric:tabular-nums; }
    .board-wrap { position:relative; padding:10px; border-radius:20px; background:#202b20; border:1px solid #435443; box-shadow:0 22px 70px #0008, inset 0 1px #ffffff12; }
    canvas { display:block; width:100%; aspect-ratio:1; border-radius:12px; background:#0c120d; image-rendering:pixelated; touch-action:none; }
    .overlay { position:absolute; inset:10px; display:grid; place-items:center; border-radius:12px; background:#071007b8; backdrop-filter:blur(5px); text-align:center; padding:24px; }
    .overlay.hidden { display:none; }
    .modal { max-width:320px; }
    .modal .tag { color:var(--green); font-size:10px; letter-spacing:.22em; font-weight:900; }
    .modal h2 { margin:9px 0 7px; font-size:clamp(27px,6vw,38px); letter-spacing:-.05em; }
    .modal p { margin:0 0 19px; color:#b4c1b0; font-size:13px; line-height:1.5; }
    button { border:0; cursor:pointer; font:inherit; }
    .primary { background:var(--green); color:#14200f; border-radius:10px; padding:12px 22px; font-weight:900; box-shadow:0 5px 0 #5e9f37; transition:transform .1s,filter .1s; }
    .primary:hover { filter:brightness(1.08); }
    .primary:active { transform:translateY(3px); box-shadow:0 2px 0 #5e9f37; }
    .toolbar { display:flex; gap:9px; margin-top:12px; }
    .toolbar button { flex:1; background:var(--panel); border:1px solid var(--line); color:#dce8d8; border-radius:11px; padding:11px; font-size:12px; font-weight:800; }
    .toolbar button:hover { background:var(--panel2); }
    .help { display:flex; justify-content:space-between; gap:12px; margin:14px 3px 0; color:var(--muted); font-size:11px; line-height:1.5; }
    kbd { color:#e6f2e0; background:#283329; border:1px solid #465447; border-radius:4px; padding:2px 5px; font:inherit; }
    .mobile-controls { display:none; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(2,46px); justify-content:center; gap:6px; margin-top:16px; }
    .mobile-controls button { border:1px solid var(--line); background:var(--panel); color:var(--green); border-radius:10px; font-size:20px; font-weight:900; touch-action: manipulation; }
    .mobile-controls button[data-dir="up"] { grid-column:2; }
    .mobile-controls button[data-dir="left"] { grid-column:1; grid-row:2; }
    .mobile-controls button[data-dir="down"] { grid-column:2; grid-row:2; }
    .mobile-controls button[data-dir="right"] { grid-column:3; grid-row:2; }
    @media (max-width:560px) {
      body { padding:16px 12px; }
      .mobile-controls { display:grid; }
      .help { justify-content:center; text-align:center; }
      .help .desktop { display:none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="eyebrow">ARCADE / 001</div><h1>NEON SNAKE<span style="color:var(--green)">.</span></h1></div>
      <div class="version">BUILD 01<br>GITHUB PAGES READY</div>
    </header>
    <section class="stats" aria-label="Статистика">
      <div class="stat"><span>СЧЁТ</span><strong id="score">000</strong></div>
      <div class="stat"><span>РЕКОРД</span><strong id="best">000</strong></div>
    </section>
    <div class="board-wrap">
      <canvas id="game" width="480" height="480" aria-label="Игровое поле змейки"></canvas>
      <div class="overlay" id="overlay">
        <div class="modal">
          <div class="tag" id="overlayTag">READY PLAYER ONE</div>
          <h2 id="overlayTitle">Готов играть?</h2>
          <p id="overlayText">Собирай светящиеся сферы, расти и не врезайся в стены или собственный хвост.</p>
          <button class="primary" id="startBtn">НАЧАТЬ ИГРУ</button>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <button id="pauseBtn">Ⅱ　ПАУЗА</button>
      <button id="restartBtn">↻　ЗАНОВО</button>
    </div>
    <div class="mobile-controls" aria-label="Управление">
      <button data-dir="up" aria-label="Вверх">↑</button>
      <button data-dir="left" aria-label="Влево">←</button>
      <button data-dir="down" aria-label="Вниз">↓</button>
      <button data-dir="right" aria-label="Вправо">→</button>
    </div>
    <div class="help">
      <span class="desktop"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> или стрелки — движение</span>
      <span><kbd>SPACE</kbd> — пауза</span>
      <span>Не дай змейке съесть себя.</span>
    </div>
  </main>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTag = document.getElementById('overlayTag');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');

  const CELLS = 24, CELL = canvas.width / CELLS;
  let snake, food, direction, nextDirection, score, best = Number(localStorage.getItem('neonSnakeBest') || 0);
  let state = 'ready', lastTime = 0, accumulator = 0, stepMs = 125;

  bestEl.textContent = String(best).padStart(3, '0');

  function randomFood() {
    let p;
    do { p = { x: Math.floor(Math.random()*CELLS), y: Math.floor(Math.random()*CELLS) }; }
    while (snake.some(s => s.x === p.x && s.y === p.y));
    return p;
  }
  function reset() {
    snake = [{x:11,y:12},{x:10,y:12},{x:9,y:12},{x:8,y:12}];
    direction = {x:1,y:0}; nextDirection = {x:1,y:0};
    score = 0; stepMs = 125; accumulator = 0;
    food = randomFood(); updateStats(); draw();
  }
  function updateStats() {
    scoreEl.textContent = String(score).padStart(3, '0');
    bestEl.textContent = String(best).padStart(3, '0');
  }
  function showOverlay(tag, title, text, button) {
    overlayTag.textContent = tag; overlayTitle.textContent = title;
    overlayText.textContent = text; startBtn.textContent = button;
    overlay.classList.remove('hidden');
  }
  function start() {
    if (state === 'ready' || state === 'over') reset();
    state = 'playing'; overlay.classList.add('hidden');
    pauseBtn.textContent = 'Ⅱ　ПАУЗА';
  }
  function pause() {
    if (state === 'playing') {
      state = 'paused'; showOverlay('PAUSED', 'Пауза', 'Передохни. Змейка никуда не убежит.', 'ПРОДОЛЖИТЬ');
      pauseBtn.textContent = '▶　ПРОДОЛЖИТЬ';
    } else if (state === 'paused') start();
  }
  function endGame() {
    state = 'over';
    showOverlay('GAME OVER', 'Игра окончена', `Твой счёт: ${score}. Попробуешь побить рекорд?`, 'ЕЩЁ РАЗ');
    pauseBtn.textContent = 'Ⅱ　ПАУЗА';
  }
  function setDirection(dir) {
    const dirs = {
      up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}
    };
    const d = dirs[dir];
    if (!d || (d.x === -direction.x && d.y === -direction.y)) return;
    nextDirection = d;
  }
  function tick() {
    direction = nextDirection;
    const head = {x:snake[0].x + direction.x, y:snake[0].y + direction.y};
    const ate = head.x === food.x && head.y === food.y;
    const body = ate ? snake : snake.slice(0, -1);
    if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
        body.some(s => s.x === head.x && s.y === head.y)) {
      endGame(); return;
    }
    snake.unshift(head);
    if (ate) {
      score += 10;
      if (score > best) { best = score; localStorage.setItem('neonSnakeBest', best); }
      stepMs = Math.max(65, 125 - Math.floor(score / 50) * 5);
      food = randomFood(); updateStats();
    } else snake.pop();
  }
  function roundedRect(x,y,w,h,r) {
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  }
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#0c120d'; ctx.fillRect(0,0,480,480);
    ctx.strokeStyle = '#1b281c'; ctx.lineWidth = 1;
    for (let i=0;i<=CELLS;i++) {
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,480); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(480,i*CELL); ctx.stroke();
    }
    // Food glow
    const fx = food.x*CELL + CELL/2, fy = food.y*CELL + CELL/2;
    ctx.save(); ctx.shadowColor = '#ff6b6b'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#ff7777'; ctx.beginPath(); ctx.arc(fx,fy, CELL*.31,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // Snake
    snake.forEach((part,i) => {
      const pad = i === 0 ? 2 : 2.5;
      const x=part.x*CELL+pad, y=part.y*CELL+pad, size=CELL-pad*2;
      ctx.save();
      ctx.shadowColor = i===0 ? '#b8ff78' : '#71d94b';
      ctx.shadowBlur = i===0 ? 15 : 5;
      ctx.fillStyle = i===0 ? '#c4ff8d' : `hsl(${103 - Math.min(i,18)*1.4}, 66%, ${57 - Math.min(i,18)*.7}%)`;
      roundedRect(x,y,size,size, i===0 ? 6 : 4);
      ctx.restore();
      if (i===0) {
        ctx.fillStyle='#24351b';
        const ex = direction.x === 0 ? 0 : direction.x > 0 ? 4 : -4;
        const ey = direction.y === 0 ? 0 : direction.y > 0 ? 4 : -4;
        ctx.beginPath(); ctx.arc(x+size/2+ex-3, y+size/2+ey-3, 1.6,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+size/2+ex+3, y+size/2+ey+3, 1.6,0,Math.PI*2); ctx.fill();
      }
    });
  }
  function frame(time) {
    if (!lastTime) lastTime = time;
    const delta = Math.min(time-lastTime, 100); lastTime = time;
    if (state === 'playing') {
      accumulator += delta;
      while (accumulator >= stepMs) { tick(); accumulator -= stepMs; if (state !== 'playing') break; }
    }
    draw();
    requestAnimationFrame(frame);
  }
  document.addEventListener('keydown', e => {
    const keys = {ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',
      ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
    if (keys[e.key]) { e.preventDefault(); setDirection(keys[e.key]); }
    if (e.code === 'Space') { e.preventDefault(); if (state==='ready' || state==='over') start(); else pause(); }
    if (e.key === 'Enter' && state !== 'playing') start();
  });
  document.querySelectorAll('[data-dir]').forEach(btn => {
    btn.addEventListener('pointerdown', e => { e.preventDefault(); setDirection(btn.dataset.dir); });
  });
  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', () => { if (state==='ready' || state==='over') start(); else pause(); });
  restartBtn.addEventListener('click', () => { reset(); start(); });
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
